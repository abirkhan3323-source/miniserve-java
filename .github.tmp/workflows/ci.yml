name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin' }
      - run: javac -d out src/main/java/com/miniserve/MiniServe.java
      - run: java -cp out com.miniserve.MiniServe 8080 &
      - run: curl -s http://localhost:8080 | head
